name: 数据库访问验证
description: 补充程序访问证据或反馈具体失败步骤
title: "[访问验证] 数据库名称"
body:
  - type: markdown
    attributes:
      value: "请只提交脱敏结果，不上传凭据、浏览器状态、完整论文或受限数据。"
  - type: input
    id: database
    attributes:
      label: 数据库名称与目录 ID
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 日期、版本、系统、网络类型与认证方式
      description: "只填写校内/VPN/校外等类型，不填写账号或真实 IP。"
    validations:
      required: true
  - type: dropdown
    id: method
    attributes:
      label: 操作方式
      options:
        - MCP 工具
        - 人工网页（仅作排障证据）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 样本和操作步骤
      description: "填写 DOI/标题或库表 ID、最小筛选条件、工具名称。删除带会话凭据的 URL。"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 成功步骤、失败码与文件验证
      description: "分别记录检索、读取、下载；文件格式/大小/SHA256；是否重启后仍有效。"
    validations:
      required: true
